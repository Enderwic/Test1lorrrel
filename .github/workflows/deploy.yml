# Деплой Змейки на GitHub Pages при каждом пуше в main.
# --base=./ делает все пути к ассетам относительными,
# чтобы сайт корректно работал из подкаталога /Test1lorrrel/
# (это эквивалент base: './' в vite.config).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Возможность запустить деплой вручную из вкладки Actions
  workflow_dispatch:

# Разрешения, необходимые для деплоя на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Отменяем идущий деплой, если прилетел новый пуш
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # кэш по package-lock.json (npm ci требует его наличия)

      - name: Install dependencies
        run: npm ci

      - name: Build (relative base для подкаталога Pages)
        run: npm run build -- --base=./

      - name: Upload dist/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
